name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # every day at 18:00 UTC = 02:00 in Manila
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      SUITE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'smoke' }}
      # Test CI's own copy of the app: the public site blocks GitHub's servers
      TEST_ENV: local
      SPRINT: sprint5
      DISABLE_LOGGING: 'true'
    steps:
      - uses: actions/checkout@v4

      # Start the app with Docker, following the app's own CI workflow
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          ref: ae7caecb811dd8952c09d997e69be7cb946ecd44 # the version this suite was written against
          path: app
      - name: Start the app
        working-directory: app
        run: docker compose -f docker-compose.yml up -d
      - name: Give the containers time to start
        run: sleep 30
      - name: Install the API's packages
        working-directory: app
        run: docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi
      - name: Wait for the database
        working-directory: app
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent; then exit 0; fi
            sleep 2
          done
          echo "The database did not start"
          exit 1
      - name: Create and fill the database
        working-directory: app
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed
      - name: Wait for the website
        working-directory: app
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q 200; then exit 0; fi
            sleep 5
          done
          echo "The website did not start within 5 minutes"
          docker compose logs angular-ui
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run tests
        run: |
          if [ "$SUITE" = "smoke" ]; then
            npx playwright test --grep @smoke --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --pass-with-no-tests
          else
            npx playwright test --grep-invert @visual --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report
          retention-days: 14

  publish-report:
    if: ${{ !cancelled() && needs.merge-reports.result == 'success' && github.event_name != 'pull_request' }}
    needs: [merge-reports]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: html-report
          path: playwright-report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report
      - id: deployment
        uses: actions/deploy-pages@v4